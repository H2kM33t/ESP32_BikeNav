;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1   ; ESP32-C3 SuperMini uses the same C3 silicon/pinout as this generic devkit definition
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.5.0
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.3

build_flags =
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -D ARDUINO_USB_MODE=1          ; required alongside CDC_ON_BOOT for native-USB boards (C3/S3) or Serial won't be defined
    -D ARDUINO_USB_CDC_ON_BOOT=1   ; C3 SuperMini's USB-C port is native USB-CDC serial, not a UART bridge
    #-DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384